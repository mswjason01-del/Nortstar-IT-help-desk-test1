{% extends 'base.html' %}{% block heading %}Submit a support request{% endblock %}{% block content %}<form method="post" class="panel form-card"><div class="form-intro"><h2>Tell us what’s happening</h2><p>Provide enough detail for the IT team to get started.</p></div><label>Subject<input required name="title" placeholder="e.g. Cannot connect to the office Wi-Fi"></label><label>Category<select required name="category"><option value="" disabled selected>Select a category</option>{% for c in ['Hardware','Software','Network','Access & Accounts','Security','Other'] %}<option>{{ c }}</option>{% endfor %}</select></label><label>Priority<select required name="priority"><option value="" disabled selected>How urgent is it?</option>{% for p in ['Low','Medium','High','Critical'] %}<option>{{ p }}</option>{% endfor %}</select></label><label class="wide">Describe the problem<textarea required name="description" rows="5" placeholder="What were you trying to do? What happened instead? Include any error messages."></textarea></label><label>Your name<input required name="requester_name" placeholder="Your full name"></label><label>Work email<input required type="email" name="requester_email" placeholder="you@northstar.local"></label><div class="wide submit-row"><button class="button">Submit request →</button><span>Your request will be visible to the IT support team.</span></div></form>{% endblock %}
