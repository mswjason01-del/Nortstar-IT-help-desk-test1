{% extends 'base.html' %}{% block heading %}All tickets{% endblock %}{% block content %}<section class="panel"><form class="filters"><input name="q" value="{{ filters.q }}" placeholder="Search tickets or employees"><select name="status"><option value="">All statuses</option>{% for item in STATUSES|default([]) %}{% endfor %}<option {% if filters.status=='Open' %}selected{% endif %}>Open</option><option {% if filters.status=='In Progress' %}selected{% endif %}>In Progress</option><option {% if filters.status=='Waiting on Employee' %}selected{% endif %}>Waiting on Employee</option><option {% if filters.status=='Resolved' %}selected{% endif %}>Resolved</option></select><select name="priority"><option value="">All priorities</option>{% for p in ['Low','Medium','High','Critical'] %}<option {% if filters.priority==p %}selected{% endif %}>{{ p }}</option>{% endfor %}</select><select name="category"><option value="">All categories</option>{% for c in ['Hardware','Software','Network','Access & Accounts','Security','Other'] %}<option {% if filters.category==c %}selected{% endif %}>{{ c }}</option>{% endfor %}</select><button class="button">Filter</button></form>{% include '_table.html' %}</section>{% endblock %}
